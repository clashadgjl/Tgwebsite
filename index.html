<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Wallet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #fff);
            --text-color: var(--tg-theme-text-color, #000);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #fff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Баланс */
        .balance-card {
            background-color: var(--secondary-bg);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .balance-title { font-size: 14px; opacity: 0.7; }
        .balance-amount { font-size: 32px; font-weight: bold; margin: 10px 0; }

        /* Кнопки действий */
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-income { background-color: #4cd964; color: white; }
        .btn-expense { background-color: #ff3b30; color: white; }
        .btn-main { background-color: var(--button-color); color: var(--button-text-color); width: 100%; margin-top: 10px;}

        /* Формы ввода (скрыты по умолчанию) */
        .form-container {
            display: none;
            background-color: var(--secondary-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .form-container.active { display: block; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        /* Фильтры и список */
        .filters { margin-bottom: 15px; display: flex; gap: 10px; }
        
        .transaction-list {
            list-style: none;
            padding: 0;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .t-info { display: flex; flex-direction: column; }
        .t-name { font-weight: 600; }
        .t-cat { font-size: 12px; opacity: 0.7; }
        .t-amount { font-weight: bold; }
        .income { color: #4cd964; }
        .expense { color: #ff3b30; }

    </style>
</head>
<body>

    <div class="balance-card">
        <div class="balance-title">Текущий баланс</div>
        <div class="balance-amount" id="totalBalance">0 ₽</div>
    </div>

    <div class="actions">
        <button class="btn btn-income" onclick="showForm('income')">+ Пополнить</button>
        <button class="btn btn-expense" onclick="showForm('expense')">- Списать</button>
    </div>

    <div id="incomeForm" class="form-container">
        <h3>Пополнение</h3>
        <input type="number" id="incomeAmount" placeholder="Сумма">
        <button class="btn btn-main" onclick="addTransaction('income')">Добавить</button>
    </div>

    <div id="expenseForm" class="form-container">
        <h3>Расход</h3>
        <input type="text" id="expenseCat" placeholder="Категория (напр. Еда)">
        <input type="text" id="expenseItem" placeholder="Товар (напр. Пицца)">
        <input type="number" id="expenseAmount" placeholder="Сумма">
        <button class="btn btn-main" onclick="addTransaction('expense')">Списать</button>
    </div>

    <div class="filters">
        <select id="categoryFilter" onchange="renderHistory()">
            <option value="all">Все категории</option>
            </select>
        <button class="btn" style="background: #333; color: white;" onclick="exportToExcel()">📥 Excel</button>
    </div>

    <ul class="transaction-list" id="historyList">
        </ul>
<iframe width="110" height="200" src="https://www.myinstants.com/instant/detka-ty-vypolnila-zadanie-na-5-17287/embed/" frameborder="0" scrolling="no"></iframe>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран

        // Состояние приложения
        let transactions = JSON.parse(localStorage.getItem('wallet_transactions')) || [];

        // Инициализация
        function init() {
            updateBalance();
            updateCategoryFilter();
            renderHistory();
        }

        // Переключение форм
        function showForm(type) {
            document.getElementById('incomeForm').classList.remove('active');
            document.getElementById('expenseForm').classList.remove('active');
            
            if (type === 'income') document.getElementById('incomeForm').classList.add('active');
            if (type === 'expense') document.getElementById('expenseForm').classList.add('active');
        }

        // Добавление транзакции
        function addTransaction(type) {
            let t = {
                id: Date.now(),
                date: new Date().toISOString().split('T')[0], // ГГГГ-ММ-ДД
                type: type
            };

            if (type === 'income') {
                const amount = parseFloat(document.getElementById('incomeAmount').value);
                if (!amount) return alert('Введите сумму');
                
                t.amount = amount;
                t.category = 'Пополнение';
                t.item = 'Перевод';
                
                document.getElementById('incomeAmount').value = '';
            } else {
                const cat = document.getElementById('expenseCat').value;
                const item = document.getElementById('expenseItem').value;
                const amount = parseFloat(document.getElementById('expenseAmount').value);

                if (!cat || !item || !amount) return alert('Заполните все поля');

                t.amount = -amount; // Расход с минусом
                t.category = cat;
                t.item = item;

                document.getElementById('expenseCat').value = '';
                document.getElementById('expenseItem').value = '';
                document.getElementById('expenseAmount').value = '';
            }

            transactions.unshift(t); // Добавляем в начало списка
            saveData();
            
            // Скрыть формы и обновить интерфейс
            document.getElementById('incomeForm').classList.remove('active');
            document.getElementById('expenseForm').classList.remove('active');
            init();
            
            // Вибрация Taptic Engine (приятный отклик)
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        // Сохранение в LocalStorage
        function saveData() {
            localStorage.setItem('wallet_transactions', JSON.stringify(transactions));
        }

        // Обновление баланса
        function updateBalance() {
            const total = transactions.reduce((acc, curr) => acc + curr.amount, 0);
            document.getElementById('totalBalance').innerText = total.toLocaleString() + ' ₽';
        }

        // Обновление выпадающего списка категорий
        function updateCategoryFilter() {
            const categories = [...new Set(transactions.map(t => t.category))];
            const select = document.getElementById('categoryFilter');
            const currentVal = select.value;

            select.innerHTML = '<option value="all">Все категории</option>';
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.innerText = cat;
                select.appendChild(option);
            });
            select.value = currentVal;
        }

        // Рендер истории
        function renderHistory() {
            const filter = document.getElementById('categoryFilter').value;
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            const filtered = filter === 'all' 
                ? transactions 
                : transactions.filter(t => t.category === filter);

            filtered.forEach(t => {
                const li = document.createElement('li');
                li.className = 'transaction-item';
                
                const amountClass = t.type === 'income' ? 'income' : 'expense';
                const sign = t.type === 'income' ? '+' : '';

                li.innerHTML = `
                    <div class="t-info">
                        <span class="t-name">${t.item}</span>
                        <span class="t-cat">${t.category} • ${t.date}</span>
                    </div>
                    <div class="t-amount ${amountClass}">${sign}${t.amount} ₽</div>
                `;
                list.appendChild(li);
            });
        }

        // Экспорт в Excel
        function exportToExcel() {
            // Подготовка данных для красивой таблицы
            const data = transactions.map(t => ({
                "Дата": t.date,
                "Тип": t.type === 'income' ? 'Доход' : 'Расход',
                "Категория": t.category,
                "Товар": t.item,
                "Сумма": t.amount
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Финансы");

            // Скачивание файла
            XLSX.writeFile(wb, "Wallet_Export.xlsx");
        }

        // Запуск при загрузке
        init();
    </script>
</body>
  </html>
