<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet with Delete</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #fff);
            --text-color: var(--tg-theme-text-color, #000);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #fff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
            --danger-color: #ff3b30;
            --card-active: #3390ec;
            --card-inactive: #8e8e93;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            padding-bottom: 80px;
        }

        /* === Слайдер счетов === */
        .accounts-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
        }
        .accounts-wrapper {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
            scrollbar-width: none;
        }
        .accounts-wrapper::-webkit-scrollbar { display: none; }

        .account-card {
            min-width: 140px; padding: 15px; background-color: var(--secondary-bg);
            border-radius: 15px; cursor: pointer; transition: transform 0.2s; flex-shrink: 0;
        }
        .account-card.active {
            background-color: var(--button-color); color: var(--button-text-color);
            transform: scale(1.02); box-shadow: 0 4px 10px rgba(51, 144, 236, 0.3);
        }
        .account-name { font-size: 12px; opacity: 0.8; margin-bottom: 5px; }
        .account-balance { font-size: 18px; font-weight: bold; }

        .add-account-btn {
            min-width: 50px; display: flex; align-items: center; justify-content: center;
            background: var(--secondary-bg); border-radius: 15px; font-size: 24px; cursor: pointer;
        }

        /* === Общий баланс === */
        .total-display { text-align: center; margin: 10px 0 20px 0; }
        .total-label { font-size: 12px; opacity: 0.6; }
        .total-value { font-size: 36px; font-weight: 800; }

        /* Кнопки действий */
        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .btn:active { opacity: 0.8; }
        .btn-income { background-color: #4cd964; color: white; }
        .btn-expense { background-color: var(--danger-color); color: white; }
        .btn-main { background-color: var(--button-color); color: var(--button-text-color); width: 100%; margin-top: 10px;}
        .btn-icon { flex: 0 0 auto; width: 40px; }

        /* Формы */
        .form-container {
            display: none; background-color: var(--secondary-bg);
            padding: 15px; border-radius: 10px; margin-bottom: 20px;
        }
        .form-container.active { display: block; }
        input, select {
            width: 100%; padding: 12px; margin-bottom: 10px;
            border: 1px solid rgba(0,0,0,0.1); border-radius: 8px;
            background: var(--bg-color); color: var(--text-color); box-sizing: border-box;
        }

        /* Фильтры */
        .filters { display: flex; gap: 8px; margin-bottom: 15px; }
        .filters select { margin-bottom: 0; flex-grow: 1; }

        /* Список операций */
        .transaction-list { list-style: none; padding: 0; }
        .transaction-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .t-info { display: flex; flex-direction: column; flex-grow: 1; } /* Растягиваем инфо, чтобы отодвинуть правую часть */
        .t-name { font-weight: 600; font-size: 15px; }
        .t-cat { font-size: 12px; opacity: 0.6; }
        
        /* Правая часть строки (Сумма + Кнопка удаления) */
        .t-right { display: flex; align-items: center; gap: 10px; }
        .t-amount { font-weight: bold; font-size: 15px; }
        
        .income { color: #4cd964; }
        .expense { color: #ff3b30; }
        .system { color: var(--button-color); }

        /* Кнопка удаления отдельной записи */
        .delete-item-btn {
            background: none; border: none; color: #aaa;
            font-size: 20px; cursor: pointer; padding: 0 5px;
        }
        .delete-item-btn:hover { color: var(--danger-color); }

    </style>
</head>
<body>

    <div class="accounts-header">
        <h3 style="margin:0">Мои счета</h3>
    </div>
    <div class="accounts-wrapper" id="accountsList"></div>

    <div class="total-display">
        <div class="total-label">Баланс счета</div>
        <div class="total-value" id="mainBalance">0 ₽</div>
    </div>

    <div class="actions">
        <button class="btn btn-income" onclick="openForm('income')">Пополнить</button>
        <button class="btn btn-expense" onclick="openForm('expense')">Списать</button>
    </div>

    <div id="incomeForm" class="form-container">
        <h4>Пополнение</h4>
        <input type="number" id="incAmount" placeholder="Сумма">
        <button class="btn btn-main" onclick="addTransaction('income')">Сохранить</button>
    </div>

    <div id="expenseForm" class="form-container">
        <h4>Расход</h4>
        <input type="text" id="expCat" placeholder="Категория">
        <input type="text" id="expItem" placeholder="Название">
        <input type="number" id="expAmount" placeholder="Сумма">
        <button class="btn btn-main" onclick="addTransaction('expense')">Списать</button>
    </div>

    <div class="filters">
        <select id="catFilter" onchange="renderHistory()">
            <option value="all">Все операции</option>
        </select>
        <button class="btn btn-icon" style="background:#217346; color:#fff" onclick="exportExcel()">📥</button>
        <button class="btn btn-icon" style="background:var(--danger-color); color:#fff" onclick="clearAccountHistory()">🗑</button>
    </div>

    <ul class="transaction-list" id="historyList"></ul>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let accounts = JSON.parse(localStorage.getItem('w_accounts')) || [];
        let transactions = JSON.parse(localStorage.getItem('wallet_transactions')) || [];
        let currentAccountId = localStorage.getItem('w_current_account_id');

        // Миграция для старых пользователей
        if (accounts.length === 0) {
            const defaultAcc = { id: 'acc_1', name: 'Основной', created: Date.now() };
            accounts.push(defaultAcc);
            currentAccountId = defaultAcc.id;
            transactions = transactions.map(t => {
                if (!t.accountId) t.accountId = defaultAcc.id;
                return t;
            });
            saveData();
        }

        function init() {
            if(!currentAccountId) currentAccountId = accounts[0].id;
            renderAccounts();
            renderHistory();
            updateFilter();
        }

        // === СЧЕТА ===
        function renderAccounts() {
            const wrapper = document.getElementById('accountsList');
            wrapper.innerHTML = '';
            accounts.forEach(acc => {
                const bal = transactions
                    .filter(t => t.accountId === acc.id)
                    .reduce((sum, t) => sum + t.amount, 0);
                const el = document.createElement('div');
                el.className = `account-card ${acc.id === currentAccountId ? 'active' : ''}`;
                el.onclick = () => switchAccount(acc.id);
                el.innerHTML = `<div class="account-name">${acc.name}</div><div class="account-balance">${bal.toLocaleString()} ₽</div>`;
                wrapper.appendChild(el);
            });
            const addBtn = document.createElement('div');
            addBtn.className = 'add-account-btn';
            addBtn.innerHTML = '+';
            addBtn.onclick = createAccount;
            wrapper.appendChild(addBtn);
            updateMainBalanceDisplay();
        }

        function switchAccount(id) {
            currentAccountId = id;
            localStorage.setItem('w_current_account_id', id);
            renderAccounts();
            renderHistory();
            updateFilter();
            document.querySelectorAll('.form-container').forEach(d => d.classList.remove('active'));
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function createAccount() {
            const name = prompt("Название нового счета:");
            if (!name) return;
            const newAcc = { id: 'acc_' + Date.now(), name: name, created: Date.now() };
            accounts.push(newAcc);
            saveData();
            switchAccount(newAcc.id);
        }

        function updateMainBalanceDisplay() {
            const bal = transactions.filter(t => t.accountId === currentAccountId).reduce((sum, t) => sum + t.amount, 0);
            document.getElementById('mainBalance').innerText = bal.toLocaleString() + ' ₽';
        }

        // === ТРАНЗАКЦИИ ===
        function openForm(type) {
            document.querySelectorAll('.form-container').forEach(d => d.classList.remove('active'));
            if(type === 'income') document.getElementById('incomeForm').classList.add('active');
            if(type === 'expense') document.getElementById('expenseForm').classList.add('active');
        }

        function addTransaction(type) {
            let t = {
                id: Date.now(), // Уникальный ID важен для удаления
                date: new Date().toISOString().split('T')[0],
                type: type,
                accountId: currentAccountId
            };
            if (type === 'income') {
                const val = parseFloat(document.getElementById('incAmount').value);
                if(!val) return alert('Сумма?');
                t.amount = val; t.category = 'Пополнение'; t.item = 'Перевод';
                document.getElementById('incAmount').value = '';
            } else {
                const cat = document.getElementById('expCat').value;
                const item = document.getElementById('expItem').value;
                const val = parseFloat(document.getElementById('expAmount').value);
                if(!val || !cat || !item) return alert('Заполните все поля');
                t.amount = -val; t.category = cat; t.item = item;
                document.getElementById('expCat').value = ''; document.getElementById('expItem').value = ''; document.getElementById('expAmount').value = '';
            }
            transactions.unshift(t);
            saveData();
            document.querySelectorAll('.form-container').forEach(d => d.classList.remove('active'));
            init();
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        // === НОВАЯ ФУНКЦИЯ: Удаление конкретной записи ===
        function deleteTransaction(id) {
            if(!confirm('Удалить эту запись навсегда? Баланс изменится.')) return;
            
            // Фильтруем массив, оставляя всё, кроме ID, который надо удалить
            transactions = transactions.filter(t => t.id !== id);
            
            saveData();
            init(); // Пересчитываем баланс и перерисовываем
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        }

        // === ИСТОРИЯ ===
        function renderHistory() {
            const filter = document.getElementById('catFilter').value;
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            let relevant = transactions.filter(t => t.accountId === currentAccountId);
            if (filter !== 'all') relevant = relevant.filter(t => t.category === filter);

            if (relevant.length === 0) {
                list.innerHTML = '<li style="text-align:center; opacity:0.5; padding:20px;">Нет операций</li>';
                return;
            }

            relevant.forEach(t => {
                const li = document.createElement('li');
                li.className = 'transaction-item';
                let colorClass = t.amount > 0 ? 'income' : 'expense';
                if(t.category === 'Система') colorClass = 'system';
                const sign = t.amount > 0 ? '+' : '';

                li.innerHTML = `
                    <div class="t-info">
                        <span class="t-name">${t.item}</span>
                        <span class="t-cat">${t.category} • ${t.date}</span>
                    </div>
                    <div class="t-right">
                        <span class="t-amount ${colorClass}">${sign}${t.amount} ₽</span>
                        <button class="delete-item-btn" onclick="deleteTransaction(${t.id})">&times;</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function updateFilter() {
            const relevant = transactions.filter(t => t.accountId === currentAccountId);
            const cats = [...new Set(relevant.map(t => t.category))];
            const sel = document.getElementById('catFilter');
            const currentVal = sel.value;
            sel.innerHTML = '<option value="all">Все операции</option>';
            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.innerText = c; sel.appendChild(opt);
            });
            if ([...sel.options].some(o => o.value === currentVal)) sel.value = currentVal;
        }

        function saveData() {
            localStorage.setItem('wallet_transactions', JSON.stringify(transactions));
            localStorage.setItem('w_accounts', JSON.stringify(accounts));
        }

        function clearAccountHistory() {
            if(!confirm('Очистить ВСЮ историю этого счета?')) return;
            const currentBal = transactions.filter(t => t.accountId === currentAccountId).reduce((acc, t) => acc + t.amount, 0);
            transactions = transactions.filter(t => t.accountId !== currentAccountId);
            if (currentBal !== 0) {
                transactions.unshift({
                    id: Date.now(), date: new Date().toISOString().split('T')[0],
                    type: 'income', category: 'Система', item: 'Начальный остаток', amount: currentBal, accountId: currentAccountId
                });
            }
            saveData(); init();
        }

        function exportExcel() {
            const relevant = transactions.filter(t => t.accountId === currentAccountId);
            if(!relevant.length) return alert("Пусто");
            const data = relevant.map(t => ({ "Дата": t.date, "Категория": t.category, "Товар": t.item, "Сумма": t.amount }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Выписка");
            const accName = accounts.find(a => a.id === currentAccountId).name;
            XLSX.writeFile(wb, `Wallet_${accName}.xlsx`);
        }

        init();
    </script>
</body>
</html>
